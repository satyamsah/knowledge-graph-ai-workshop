version: "3.8"

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: kg-workshop
    ports:
      - "7474:7474"   # Browser UI  → open http://localhost:7474
      - "7687:7687"   # Bolt driver → used by Python
    environment:
      NEO4J_AUTH: neo4j/workshop123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
